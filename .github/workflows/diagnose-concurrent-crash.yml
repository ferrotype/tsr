name: diagnose concurrent compiler crash

on:
  push:
    branches: [codex/concurrent-checker-crash]
    paths: [.github/workflows/diagnose-concurrent-crash.yml]

permissions:
  contents: read

jobs:
  sanitizer:
    name: concurrent fixture under ${{ matrix.sanitizer }} sanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 1
      RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }} -Cforce-frame-pointers=yes
      TSR_TESTRUNNER_TRACE_PHASES: 1
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 2f464bf525579d4faa141b466786d04ac04f462e
          submodules: true
          persist-credentials: false
      - name: Install the pinned instrumentation toolchain and apply traces
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA" 1ec148d488991b17228de343dcc01c1477559059
          git diff 1ec148d488991b17228de343dcc01c1477559059 "$GITHUB_SHA" -- crates/tsr_testrunner | git apply
          rustup toolchain install nightly-2026-09-05 --profile minimal --component rust-src --component llvm-tools-preview
          echo "$(rustc +nightly-2026-09-05 --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: crash-runner-${{ matrix.sanitizer }}
      - name: Build instrumented runner and standard library
        timeout-minutes: 10
        run: cargo +nightly-2026-09-05 build -Zbuild-std --release --locked --target x86_64-unknown-linux-gnu -p tsr_testrunner --bin tsr-testrunner
      - name: Exercise the exact concurrent fixture
        timeout-minutes: 2
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1
        run: |
          mkdir -p crash-output
          for iteration in $(seq 1 30); do
            target/x86_64-unknown-linux-gnu/release/tsr-testrunner --suite compiler --mode concurrent run \
              --id 'conformance/typeOfThisInStaticMembers11(target=esnext).ts' \
              --local "crash-output/local-$iteration" \
              > "crash-output/result-$iteration.ndjson" 2> "crash-output/trace-$iteration.log"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          results=list(Path('crash-output').glob('result-*.ndjson'))
          assert len(results)==30, len(results)
          for path in results:
              rows=[json.loads(line) for line in path.read_text().splitlines()]
              assert len(rows)==9 and all(row['state']=='pass' for row in rows), (path,rows)
          print('30 runs: all 270 subtests pass without sanitizer reports')
          PY
      - name: Print the last trace
        if: always()
        run: |
          latest=$(find crash-output -name 'trace-*.log' 2>/dev/null | sort -V | tail -1)
          if [[ -n "$latest" ]]; then tail -150 "$latest"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concurrent-crash-${{ matrix.sanitizer }}
          path: crash-output
          retention-days: 3
