name: diagnose concurrent compiler crash

on:
  push:
    branches: [codex/concurrent-checker-crash]
    paths:
      - .github/workflows/diagnose-concurrent-crash.yml
      - scripts/diagnose_concurrent_crash.py
      - crates/tsr_testrunner/**

permissions:
  contents: read
  actions: read

jobs:
  memcheck:
    name: original executable under Memcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 2f464bf525579d4faa141b466786d04ac04f462e
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: tsr-testrunner
          run-id: 37187571575
          github-token: ${{ github.token }}
          path: runner
      - name: Check the original concurrent process for invalid memory accesses
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind
          mkdir -p crash-output
          chmod +x runner/tsr-testrunner
          for iteration in 1 2 3 4 5; do
            MALLOC_PERTURB_=170 valgrind --tool=memcheck --error-exitcode=99 \
              --track-origins=yes --leak-check=no --num-callers=50 \
              --log-file="crash-output/memcheck-$iteration.log" \
              runner/tsr-testrunner --suite compiler --mode concurrent run \
              --id 'conformance/typeOfThisInStaticMembers11(target=esnext).ts' \
              --local "crash-output/local-$iteration" \
              > "crash-output/result-$iteration.ndjson"
          done
      - name: Print memory findings
        if: always()
        run: cat crash-output/memcheck-*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concurrent-crash-memcheck
          path: crash-output
          retention-days: 3
