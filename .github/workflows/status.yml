# Status workflow (docs/TRACKING.md, "Commands, publication and history").
#
# views:     validate deterministic views of the archived evidence, including the worklist.
# producers: on macOS and Linux rerun the registered producers, enforce their measured
#            results and S01/S03/S04/S05/S06, and publish views and raw evidence even when a gate fails.
# msrv:      compile the locked workspace and all targets on the declared minimum Rust.
# Nothing is committed back; evidence in the repository is captured and reviewed locally.
#
# The workflow requires S01/S03/S04/S05/S06 and quality checks independently of unfinished sprints.
# Temporarily reduced at the owner's request (2026-09-13) to macos-15 (arm64)
# and ubuntu-24.04 (x86_64) while CI is overloaded. ADR 0002's supported targets
# are unchanged. Restore macos-15-intel and ubuntu-24.04-arm in both matrices
# when the temporary runner pause ends.
name: status

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: status-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Runner-local evidence records the effective build environment. Archived views
  # are checked using their recorded context, not this runner's environment.

jobs:
  views:
    name: committed views are current
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check packaged assets and publication policy
        run: python3 scripts/package_assets.py --check
      - name: Validate provenance and schemas
        run: cargo xtask validate
      - name: Check committed views and worklist against archived evidence
        run: cargo xtask status --check-committed

  msrv:
    name: declared minimum Rust on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Repository tests and evidence tools still use the pinned upstream tree.
          submodules: true
      - name: Read and validate toolchain pins
        id: pins
        run: python3 scripts/s04_runtime.py github-outputs >> "$GITHUB_OUTPUT"
      - name: Install the declared minimum toolchain
        run: rustup toolchain install "${{ steps.pins.outputs.msrv }}" --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ steps.pins.outputs.msrv }}
      - name: Build the locked workspace on the minimum Rust version
        run: cargo +${{ steps.pins.outputs.msrv }} check --workspace --all-targets --all-features --locked

  producers:
    name: producers on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Read and validate toolchain pins
        id: pins
        run: python3 scripts/s04_runtime.py github-outputs >> "$GITHUB_OUTPUT"
      - name: Check packaged assets and publication policy
        run: python3 scripts/package_assets.py --check
      - name: Validate provenance and schemas
        id: validate
        if: ${{ !cancelled() }}
        run: cargo xtask validate
      - uses: actions/setup-go@v6
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        with:
          go-version: ${{ steps.pins.outputs.go }}
          cache-dependency-path: |
            upstream/tsc/go.sum
            upstream/tools/go.sum
      - name: Read generator toolchain pins from the upstream package
        id: generator_pins
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          package = json.loads(Path("upstream/package.json").read_text())
          pins = package["volta"]
          assert package["packageManager"].split("+")[0] == "npm@" + pins["npm"]
          print("node=" + pins["node"])
          print("npm=" + pins["npm"])
          PY
      - name: Install the pinned generator Node.js and restore npm cache
        id: generator_node
        uses: actions/setup-node@v7
        if: ${{ !cancelled() && steps.validate.outcome == 'success' && steps.generator_pins.outcome == 'success' }}
        with:
          node-version: ${{ steps.generator_pins.outputs.node }}
          cache: npm
          cache-dependency-path: upstream/package-lock.json
      - name: Install the pinned generator npm
        if: ${{ !cancelled() && steps.validate.outcome == 'success' && steps.generator_node.outcome == 'success' }}
        run: npm install --global "npm@${{ steps.generator_pins.outputs.npm }}" --ignore-scripts --no-audit --no-fund
      - uses: taiki-e/install-action@v2
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        with:
          tool: cargo-deny
      - name: Restore reusable instrumentation and oracle caches
        uses: actions/cache@v4
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        with:
          key: s04-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.nightly }}-${{ hashFiles('Cargo.lock', 'data/s04/toolchains.toml') }}
          path: |
            ~/.rustup/toolchains/${{ steps.pins.outputs.nightly }}-*
            ~/.rustup/update-hashes/${{ steps.pins.outputs.nightly }}-*
            ${{ steps.pins.outputs.cache }}
      - name: Install S04 instrumentation toolchain
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          rustup toolchain install "${{ steps.pins.outputs.nightly }}" \
            --profile minimal --component miri --component rust-src --no-self-update
      - name: Tracker self-tests
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask run selftest
      - name: Workspace build
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask run workspace
      - name: Production build without Go slice compatibility
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: python3 scripts/check_production_features.py
      - name: Generated crate contracts
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo test -p tsr_diagnostics --all-targets --all-features --locked
      - name: Scanner, numeric and shared-range contracts in debug and release
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          cargo test -p tsr_scanner -p tsr_jsnum -p tsr_core --all-targets --all-features --locked
          cargo test -p tsr_scanner -p tsr_jsnum -p tsr_core --all-targets --all-features --locked --release
      - name: Parser, AST runtime and codec contracts in debug and release
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          cargo test -p tsr_parser -p tsr_ast -p tsr_encoder --all-targets --all-features --locked
          cargo test -p tsr_parser -p tsr_ast -p tsr_encoder --all-targets --all-features --locked --release
      - name: Binder, program and configuration contracts on this native target
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          cargo test -p tsr_binder -p tsr_compiler -p tsr_tsoptions -p tsr_module -p tsr_semver -p tsr_tspath -p tsr_vfs -p tsr_bundled --all-targets --all-features --locked
          cargo test -p tsr_binder -p tsr_compiler -p tsr_tsoptions -p tsr_module -p tsr_semver -p tsr_tspath -p tsr_vfs -p tsr_bundled --all-targets --all-features --locked --release
      - name: Checker ownership, constructor and type-display contracts
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          cargo test -p tsr_arena -p tsr_checker -p tsr_nodebuilder -p tsr_printer -p s08_relater_prototype --all-features --locked
          cargo test -p tsr_arena -p tsr_checker -p tsr_nodebuilder -p tsr_printer -p s08_relater_prototype --all-features --locked --release
      - name: Test-host framing and native subprocess contracts
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          cargo test -p tsr_testhost --locked
          cargo test -p tsr_testhost --locked --release
          python3 -m unittest discover -s scripts/tests -p test_s11.py
          cargo xtask run testhost
      - name: Navigation and formatter contracts in debug and release
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          cargo test -p tsr_astnav -p tsr_format --all-targets --all-features --locked
          cargo test -p tsr_astnav -p tsr_format --all-targets --all-features --locked --release
      - name: Native allocator build and original-request accounting
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          cargo run -p tsr_bench --example allocation_probe --features allocation --locked
          cargo run -p tsr_bench --example allocation_probe --features allocation --locked --release
      - name: Oracle build and version smoke
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask run oracle
      - name: Formatting
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask run fmt
      - name: Clippy
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask run clippy
      - name: Dependency policy
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask run deny
      - name: Arena ownership, Miri and AddressSanitizer
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask run e3
      - name: Text leaves against the pinned Go oracle
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask run e4
      - name: Checker literal types and printer bytes against pinned Go
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask run checkertext
      - name: Regeneration drift and original client byte parity
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask run gen
      - name: Scanner against the pinned Go oracle
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask run scanner
      - name: Parser, runtime and protocol-8 bytes against the pinned Go oracle
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask run e1
      - name: Binder graph parity, helpers, protocol and actual stack growth
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask run binder
      - name: Source-selected S07 denominator and actual library closure
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask run e2
      - name: Config, options and program loading for every frozen variant
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask run program
      # E5/E6 require the designated >=8-CPU measurement host. Hosted correctness
      # jobs neither replay local performance evidence as measurements nor claim S07.
      - name: Regenerate views
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask status
      - name: Require successful build, smoke and quality results
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          cargo xtask check-metrics \
            'run.workspace.build == true' \
            'run.checkertext.token_literal_bytes == true' \
            'run.checkertext.helper_printer_semantics == true' \
            'run.oracle.build == true' \
            'run.oracle.smoke == true' \
            'run.fmt.clean == true' \
            'run.clippy.clean == true' \
            'run.deny.clean == true' \
            'run.selftest.pass == true' \
            'run.testhost.parity == 1' \
            'run.testhost.controls == true' \
            'run.gen.patches_apply == true' \
            'run.gen.ast_schema == true' \
            'run.gen.drift == false' \
            'run.gen.client_identical == true' \
            'run.e4.source_decoding == true' \
            'run.e4.helper_semantics == true' \
            'run.e4.slice_validity == true' \
            'run.e4.utf8_positions == true' \
            'run.e4.utf16_positions == true' \
            'run.scanner.parity == 1' \
            'run.scanner.regexp_parity == 1' \
            'run.scanner.rescan_parity == 1' \
            'run.scanner.diagnostics == true' \
            'run.scanner.token_value_bytes == true' \
            'run.scanner.table_current == true' \
            'run.e1.frozen_denominator == true' \
            'run.e1.encoder_success_error == true' \
            'run.e1.encoder_output_bytes == true' \
            'run.e1.ast_runtime == true' \
            'run.e1.ast_utilities == true' \
            'run.e1.decoder_parity == true' \
            'run.e1.decoder_watchdog == true' \
            'run.e1.depth == true' \
            'run.e1.parser_regressions == true' \
            'run.binder.parity == 1' \
            'run.binder.reached_bind == true' \
            'run.binder.supplemental_parity == 1' \
            'run.binder.protocol == true' \
            'run.binder.helpers == true' \
            'run.binder.resolvers == true' \
            'run.binder.graph_contracts == true' \
            'run.binder.depth == true' \
            'run.program.subset_loads == true' \
            'run.e2.frozen_subset == true' \
            'run.e3.shared_bound_file == true' \
            'run.e3.retained_snapshot_edit == true' \
            'run.e3.shared_pool_panic_retirement == true' \
            'run.e3.release_boundaries == true' \
            'run.e3.api_print_scratch_disposal == true' \
            'run.e3.api_scratch_disposal == true' \
            'run.e3.checker_result_retention == true' \
            'run.e3.checker_ast_retention == true' \
            'run.e3.builder_cache_retention == true' \
            'run.e3.independent_checker_merges == true' \
            'run.e3.ast_runtime == true' \
            'run.e3.id_exhaustion == true' \
            'run.e3.wrong_owner_rejected == true' \
            'run.e3.stale_and_recycled_ids_rejected == true' \
            'run.e3.concurrent_lazy_storage == true' \
            'run.e3.mapper_bundle_disposal == true' \
            'run.e3.live_owner_delta == 0' \
            'run.e3.live_allocation_delta == 0' \
            'run.e3.miri == true' \
            'run.e3.address_sanitizer == true'
      - name: S01 closes on this runner's evidence
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask check S01
      - name: S04 closes on this runner's evidence
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask check S04
      - name: S03 closes on this runner's evidence
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask check S03
      - name: S05 closes on this runner's evidence
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask check S05
      - name: S06 closes on this runner's evidence
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask check S06
      - name: Sprint S02 (informational until it closes)
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: cargo xtask check S02
        continue-on-error: true
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        with:
          name: status-${{ matrix.os }}
          path: |
            STATUS.md
            status/status.json
            status/unmapped-functions.json
            docs/status.html
            status/evidence/
            target/s08/checkertext-*/
            target/s05-reports/
            target/s06-reports/
            target/s07-binder-reports/
            target/s07-program-reports/
            target/s07-subset/review/review-payload.json
            target/s11-reports/
          if-no-files-found: error

  embedding:
    name: bare wasm and external Rust embedding
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - name: Install pinned Rust and bare wasm target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check the external consumer lockfile before wasm builds
        run: cargo metadata --locked --manifest-path tools/s10/rust-consumer/Cargo.toml --format-version 1 > /dev/null
      - name: Read JS ABI and Node pins
        id: pins
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          print('bindgen=' + json.loads(Path('tools/s10/toolchains.json').read_text())['wasm_bindgen'])
          print('node=' + json.loads(Path('upstream/package.json').read_text())['volta']['node'])
          PY
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version "${{ steps.pins.outputs.bindgen }}" --locked
      - name: Build and exercise the shipped parser
        run: |
          optimizer=$(python3 scripts/s10_toolchain.py)
          python3 scripts/s10_build.py --wasm-bindgen "$(command -v wasm-bindgen)" --wasm-opt "$optimizer"
          cargo build --locked --release -p tsr_wasm --example parser
          mapfile -t node_flags < <(python3 -c 'import json; print("\n".join(json.load(open("tools/s10/toolchains.json"))["node_flags"]))')
          node "${node_flags[@]}" tools/s10/wasm/test.mjs target/s10/parser
      - name: Build and exercise the shipped portable checker
        run: |
          python3 scripts/s10_build.py --checker --wasm-bindgen "$(command -v wasm-bindgen)"
          cargo build --locked --release -p tsr_wasm --example parser
          # rust-cache restores target/, including old or emptied capture dirs.
          # Keep fresh evidence outside that cache and never overwrite a capture.
          python3 scripts/s10_measure.py capture --kind portable --output "$RUNNER_TEMP/s10-portable-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: External consumer ownership in debug and release
        if: ${{ !cancelled() }}
        run: |
          cargo test --locked --manifest-path tools/s10/rust-consumer/Cargo.toml --target-dir target --test lifetime
          cargo test --locked --manifest-path tools/s10/rust-consumer/Cargo.toml --target-dir target --test lifetime --release
      - name: Preserve portable observations even on failure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: s10-portable
          # Include the authenticated artifact bundle needed for replay.
          path: ${{ runner.temp }}/s10-portable-${{ github.run_id }}-${{ github.run_attempt }}/
