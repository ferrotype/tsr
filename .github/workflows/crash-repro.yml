# Reproduction campaign for the rare signal 11 in the concurrent compiler suite
# (#96): typeOfThisInStaticMembers11 on 2026-10-04 and
# discriminantsAndNullOrUndefined on 2026-10-03, about one per 400,000 variant
# processes on ubuntu-latest, never in the single-threaded suite.
#
# - stress: the full concurrent suite three times per job, half the jobs at
#   CI's --jobs 4 and half oversubscribed at --jobs 12 so that preemption
#   widens race windows. Phase breadcrumbs and the fatal-signal line go to
#   stderr (kept per crash by parity.py); cores are backtraced with gdb.
# - sanitizers: the full concurrent suite under AddressSanitizer and
#   ThreadSanitizer, with an instrumented standard library.
#
# Diagnostic only; it runs on pushes to its own branch that touch this file.
name: concurrent crash reproduction

on:
  push:
    branches: [concurrent-crash-repro]
    paths: [.github/workflows/crash-repro.yml]

permissions:
  contents: read

concurrency:
  group: crash-repro
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  runner:
    name: build the traced runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: crash-repro-runner
      - name: Build
        env:
          CARGO_PROFILE_RELEASE_DEBUG: 1
        run: cargo build --release --locked -p tsr_testrunner --bin tsr-testrunner
      - uses: actions/upload-artifact@v4
        with:
          name: crash-repro-runner
          path: target/release/tsr-testrunner
          retention-days: 7
          if-no-files-found: error

  stress:
    name: stress ${{ matrix.worker }} (jobs ${{ matrix.jobs }})
    needs: runner
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        worker: [1, 2, 3, 4, 5, 6, 7, 8]
        jobs: [4, 12]
    env:
      TSR_TESTRUNNER_TRACE_PHASES: 1
      ROUNDS: 3
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: crash-repro-runner
          path: runner
      - name: Enable cores and check the fault pipeline
        run: |
          chmod +x runner/tsr-testrunner
          command -v gdb || { sudo apt-get update -qq && sudo apt-get install -y gdb; }
          mkdir -p "$RUNNER_TEMP/cores" selftest
          sudo sysctl -w "kernel.core_pattern=$RUNNER_TEMP/cores/core.%p.%t"
          ulimit -c unlimited
          set +e
          TSR_TESTRUNNER_FAULT_SELFTEST=1 runner/tsr-testrunner --suite compiler --mode concurrent list > /dev/null 2> selftest/stderr
          status=$?
          set -e
          cat selftest/stderr
          test "$status" = 139
          grep -q 'tsr-fatal .*signal=11 .*addr=0x8 .*thread=tsr-selftest .*sp=0x' selftest/stderr
          cores=("$RUNNER_TEMP/cores"/core.*)
          gdb --batch runner/tsr-testrunner "${cores[0]}" -ex 'thread apply all bt 20' > selftest/backtrace.txt 2>&1
          grep -q fault_selftest selftest/backtrace.txt
          rm -f "$RUNNER_TEMP/cores"/core.*
          echo "fault pipeline verified: line, exit signal and core backtrace"
      - name: Run the concurrent suite repeatedly
        timeout-minutes: 150
        run: |
          ulimit -c unlimited
          for round in $(seq 1 "$ROUNDS"); do
            python3 scripts/parity.py run compiler-concurrent --runner runner/tsr-testrunner \
              --jobs ${{ matrix.jobs }} --output "results/round-$round" || true
            python3 - "results/round-$round" <<'PY'
          import json, sys
          from collections import Counter
          rows = [json.loads(line) for line in open(sys.argv[1] + "/results.ndjson")]
          reasons = Counter(r.get("reason", "") for r in rows if r.get("state") == "fail"
                            and r.get("reason", "").startswith(("signal", "exit", "deadline")))
          print(f"{sys.argv[1]}: {len(rows)} rows; process failures: {dict(reasons) or 'none'}")
          PY
          done
      - name: Backtrace crashed processes
        if: always()
        run: |
          shopt -s nullglob
          mkdir -p backtraces
          for core in "$RUNNER_TEMP/cores"/core.*; do
            out="backtraces/$(basename "$core").txt"
            gdb --batch runner/tsr-testrunner "$core" \
              -ex 'set pagination off' -ex 'info threads' -ex 'info registers' \
              -ex 'x/16i $pc-32' -ex 'thread apply all bt 300' -ex 'info proc mappings' \
              > "$out" 2>&1
            echo "::group::$out"; cat "$out"; echo "::endgroup::"
          done
      - name: Summarize
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rounds = sorted(Path("results").glob("round-*"))
          subtests, crashes = 0, []
          for directory in rounds:
              rows = [json.loads(line) for line in (directory / "results.ndjson").open()]
              subtests += len(rows)
              crashes += [(directory.name, r["id"], r["reason"]) for r in rows
                          if r.get("state") == "fail" and r.get("reason", "").startswith(("signal", "exit", "deadline"))]
          lines = [f"stress worker ${{ matrix.worker }}, jobs ${{ matrix.jobs }}: {len(rounds)} rounds, {subtests} result rows",
                   f"process failures: {len(crashes)}"] + [f"- {r} {i}: {why}" for r, i, why in crashes]
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          raise SystemExit(1 if crashes else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crash-repro-stress-${{ matrix.worker }}-jobs-${{ matrix.jobs }}
          path: |
            selftest
            backtraces
            results/*/crashes
            results/*/meta.json
          retention-days: 14
          if-no-files-found: ignore

  sanitizer-runner:
    name: build the ${{ matrix.sanitizer }}-sanitized runner
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_DEBUG: 1
      RUSTFLAGS: -Zsanitizer=${{ matrix.sanitizer }} -Cforce-frame-pointers=yes
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - name: Install the pinned instrumentation toolchain
        run: |
          nightly=$(python3 -c "import tomllib;print(tomllib.load(open('data/s04/toolchains.toml','rb'))['nightly'])")
          rustup toolchain install "$nightly" --profile minimal --component rust-src
          echo "NIGHTLY=$nightly" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          key: crash-repro-${{ matrix.sanitizer }}
      - name: Build with an instrumented standard library
        run: cargo "+$NIGHTLY" build -Zbuild-std --release --locked --target x86_64-unknown-linux-gnu -p tsr_testrunner --bin tsr-testrunner
      - uses: actions/upload-artifact@v4
        with:
          name: crash-repro-${{ matrix.sanitizer }}-runner
          path: target/x86_64-unknown-linux-gnu/release/tsr-testrunner
          retention-days: 7
          if-no-files-found: error

  sanitizer:
    name: ${{ matrix.sanitizer }} sanitizer ${{ matrix.shard }}
    needs: sanitizer-runner
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
        shard: [1/4, 2/4, 3/4, 4/4]
        include:
          # ThreadSanitizer needs several times the memory: two at a time.
          - { sanitizer: address, jobs: 4 }
          - { sanitizer: thread, jobs: 2 }
    env:
      TSR_TESTRUNNER_TRACE_PHASES: 1
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:detect_stack_use_after_return=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: crash-repro-${{ matrix.sanitizer }}-runner
          path: runner
      - name: Run the concurrent shard
        timeout-minutes: 300
        run: |
          chmod +x runner/tsr-testrunner
          python3 scripts/parity.py run compiler-concurrent --runner runner/tsr-testrunner \
            --shard "${{ matrix.shard }}" --jobs ${{ matrix.jobs }} --timeout 3600 --output results || true
      - name: Summarize sanitizer reports
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          results = Path("results/results.ndjson")
          rows = [json.loads(line) for line in results.open()] if results.exists() else []
          failed = [r for r in rows if r.get("state") == "fail"
                    and r.get("reason", "").startswith(("signal", "exit", "deadline"))]
          lines = [f"${{ matrix.sanitizer }} ${{ matrix.shard }}: {len(rows)} rows, process failures: {len(failed)}"]
          for crash in sorted(Path("results/crashes").glob("*/process.json")):
              process = json.loads(crash.read_text())
              stderr = (crash.parent / "stderr").read_text(errors="replace")
              report = [line for line in stderr.splitlines() if "Sanitizer" in line or "tsr-fatal" in line][:5]
              lines.append(f"- {process['variant']}: {process['reason']}")
              lines += [f"    {line}" for line in report]
          print("\n".join(lines))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("\n".join(lines) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crash-repro-${{ matrix.sanitizer }}-${{ strategy.job-index }}
          path: |
            results/crashes
            results/meta.json
          retention-days: 14
          if-no-files-found: ignore
