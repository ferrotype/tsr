# Phase 0, sprint 3. Producer: gen (cargo xtask gen --verify)
#   run.gen.patches_apply     the carried patches apply to a clean tooling worktree at the pin
#   run.gen.ast_schema        the pinned schema.ts resolver exports normalized ast.json through the adapter
#   run.gen.drift             regenerating every generated Rust file changes nothing (false means no drift)
#   run.gen.client_identical  regenerated TypeScript is byte-identical to the untouched pinned client
# ADR 0015: the pinned resolvers and extractors stay authoritative; adapters and the gen-proto
# JSON-export patch are carried against the pin in a separate tooling worktree, never in upstream/.
id = "S03"
title = "Generators from the pinned schemas"
goal = "A tooling worktree carries the adapters and the gen-proto JSON-export patch against the pin, the pinned resolvers run unchanged, Rust emitters generate the AST, diagnostics and encoder tables, and regenerated TypeScript matches the untouched client byte for byte."
exit = [
  "sprint.S02.done == 1",
  "run.gen.patches_apply == true",
  "run.gen.ast_schema == true",
  "run.gen.drift == false",
  "run.gen.client_identical == true",
  "run.workspace.build == true",
  "run.clippy.clean == true",
]

[[item]]
id = "S03-1"
title = "Tooling worktree of the pin with the carried patches (gen-proto JSON export, adapter entry points) applying cleanly"
kind = "task"
required = true
done_when = ["run.gen.patches_apply == true"]

[[item]]
id = "S03-2"
title = "AST schema adapter: run the pinned schema.ts resolver and export normalized ast.json"
kind = "task"
required = true
done_when = ["run.gen.ast_schema == true"]

[[item]]
id = "S03-3"
title = "Rust emitters and `cargo xtask gen`: tsr_ast kinds, node data, accessors and visitors; tsr_diagnostics messages; tsr_encoder tables; generated files carry file-level port markers"
kind = "task"
required = true
done_when = ["run.gen.drift == false", "run.workspace.build == true"]

[[item]]
id = "S03-4"
title = "Regenerated TypeScript (proto.generated.ts and enums) is byte-identical to the untouched pinned client"
kind = "task"
required = true
done_when = ["run.gen.client_identical == true"]
