# Phase 0, sprint 5. Producer to register: scanner (cases = the frozen scanner case list; the
# runner derives parity from per-case results).
#   run.scanner.parity         identical token streams per file: kinds, positions, flags, value bytes, diagnostics
#   run.scanner.regexp_parity  regular-expression scanning matches the oracle over the regexp fixtures
#   run.scanner.rescan_parity  reScan entry points and JSDoc scanning modes match the oracle
# The oracle is a Go token-dump tool built from a clean export of the pin, without
# the carried S03 extractor patches. See docs/S05-protocol.md.
id = "S05"
title = "Scanner"
goal = "tsr_scanner reproduces the Go scanner over source bytes: tokens, literal values and flags, diagnostics, regular-expression scanning, Unicode identifier tables and the rescanning modes the parser and language service use."
exit = [
  "sprint.S03.done == 1",
  "sprint.S04.done == 1",
  "run.scanner.parity == 1",
  "run.scanner.regexp_parity == 1",
  "run.scanner.rescan_parity == 1",
  "run.scanner.table_current == true",
  "exp.E4.diagnostics.pass == 1",
  "exp.E4.token_value_bytes.pass == 1",
  "functions.package[internal/scanner].ratio >= 0.9",
  "run.clippy.clean == true",
]

[[item]]
id = "S05-1"
title = "Token scanning over JsString bytes: charAndSize decoding, File_appears_to_be_binary, identifiers, numbers, strings, templates, comments and directives; the oracle token-dump seam and the frozen scanner case manifest"
kind = "task"
required = true
done_when = ["run.scanner.parity == 1"]

[[item]]
id = "S05-2"
title = "Scanner diagnostics and literal values byte-identical to Go on valid, WTF-8 and malformed input"
kind = "task"
required = true
done_when = ["exp.E4.diagnostics.pass == 1", "exp.E4.token_value_bytes.pass == 1"]

[[item]]
id = "S05-3"
title = "Regular-expression scanning (regexp.go) and the Unicode property tables"
kind = "task"
required = true
done_when = ["run.scanner.regexp_parity == 1", "run.scanner.table_current == true"]

[[item]]
id = "S05-4"
title = "Rescanning entry points and JSDoc scanning modes"
kind = "task"
required = true
done_when = ["run.scanner.rescan_parity == 1"]

[[item]]
id = "S05-5"
title = "Function-level traceability for the scanner package (port markers on at least nine of ten inventoried functions)"
kind = "task"
required = true
done_when = ["functions.package[internal/scanner].ratio >= 0.9"]
