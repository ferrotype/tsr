required = true
done_when = ["run.foundations.inventory_complete == true", "run.foundations.integration_complete == true", "run.foundations.rust_witnesses_complete == true", "run.gen.patches_apply == true", "run.gen.ast_schema == true", "run.gen.drift == false", "run.gen.client_identical == true", "run.gen.locale_complete == true", "run.testhost.parity == 1", "run.testhost.controls == true", "run.workspace.build == true", "run.fmt.clean == true", "run.clippy.clean == true", "run.deny.clean == true", "run.selftest.pass == true", "run.e3.ast_runtime == true", "run.e3.miri == true", "run.e3.address_sanitizer == true"]
