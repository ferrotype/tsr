[[item]]
id = "P1B-F1b"
title = "Foundation leaf implementations satisfy the exact required operation traces"
kind = "task"
required = true
done_when = ["run.foundations.leaves_complete == true"]

[[item]]
id = "P1B-F2b"
title = "Filesystem, snapshots, paths and both matching dialects satisfy their required traces"
kind = "task"
required = true
done_when = ["run.foundations.filesystem_complete == true"]

[[item]]
id = "P1B-F3b"
title = "All 309 config/options output identities and supplementary package/resolution cases pass"
kind = "task"
required = true
done_when = ["run.config.inventory_complete == true", "run.config.tests_total == 309", "run.config.parity == 1", "run.config.direct_complete == true", "run.program.helpers == true"]

[[item]]
id = "P1B-F4b"
title = "Complete syntax schedule, exact parser/binder inventories and shared utilities pass"
kind = "task"
required = true
done_when = ["run.syntax.inventory_complete == true", "run.syntax.parity == 1", "run.foundations.utilities_complete == true", "run.e1.parity == 1", "run.e1.frozen_denominator == true", "run.binder.parity == 1", "run.binder.reached_bind == true", "run.binder.supplemental_parity == 1", "run.binder.graph_contracts == true", "run.scanner.parity == 1", "run.e4.parity == 1"]

