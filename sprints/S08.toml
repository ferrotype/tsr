# Phase 0, sprint 8. The e2 producer consumes the complete frozen subset capture;
# inputs include data/divergences.toml so an approval change reruns comparison.
# See docs/S08-E2.md. Missing captures leave correctness metrics unavailable.
#   run.e2.types_parity, run.e2.errors_parity, run.e2.comparators, run.e2.frozen_subset, run.e2.divergences_approved
#   run.e2.type_to_string_parity   typeToString output on the subset matches the oracle
#   run.e2.recursion_fixtures      deep-recursion and reentrancy fixtures pass with reserved stacks and growth guards
#   run.e5.type_footprint_ratio    joins the e5 producer
# E4 completes here with token_literal_bytes and helper_printer_semantics measured through
# production literal-type construction and original-source/regenerated printer paths.
# The checkertext producer supplies those two metrics; e4 keeps the S04 leaf scope.
# Additional producers: checkerbench (frozen checker workload), relater (cases = the frozen
# relater fixture manifest; the runner derives parity). Their inputs include the workload,
# benchmark configuration and comparison methodology. They report actual measurements:
#   run.checkerbench.throughput_ratio, run.checkerbench.allocated_bytes_ratio, run.checkerbench.retained_bytes_ratio
#     Rust checker slice / pinned Go checker, excluding parse-and-bind measurements
#   run.relater.parity
#   run.relater.throughput_ratio, run.relater.allocated_bytes_ratio, run.relater.retained_bytes_ratio
#     arena-reference/interior-mutability prototype / id-and-&mut-self relater on the same fixtures
# Positive throughput and nonnegative byte ratios validate measurement presence and domain,
# not a performance target. Baseline denominators must be measured and positive; missing or
# unusable measurements stay unavailable. No synthetic values satisfy these gates.
id = "S08"
title = "Checker slice, printer and node builder"
goal = "The frozen checker slice (literal, object, union, intersection, array and tuple types; getTypeOfSymbol; isRelatedTo; narrowing; typeToString through printer and node-builder slices; the comparators ported line by line) reproduces the .types and .errors.txt baselines on the subset, completes E4 through production literal-type and printer paths, and passes declaration-merging, recursion and reentrancy fixtures. Per-type footprint, checker throughput, allocations and retained memory are measured; the alternative relater prototype has parity and a measured comparison."
exit = [
  "sprint.S07.done == 1",
  "exp.E2.pass == 1",
  "exp.E3.independent_checker_merges.pass == 1",
  "exp.E4.pass == 1",
  "exp.E5.pass == 1",
  "run.e2.type_to_string_parity == 1",
  "run.e2.recursion_fixtures == true",
  "run.clippy.clean == true",
]

[[item]]
id = "S08-1"
title = "Checker-owned symbols, types and signatures with &mut self mutation (ADRs 0007 and 0008); checker-local declaration merges over shared files"
kind = "task"
required = true
done_when = ["exp.E3.independent_checker_merges.pass == 1"]

[[item]]
id = "S08-2"
title = "Type construction, relations and narrowing for the slice; .types and .errors.txt parity on the subset"
kind = "task"
required = true
done_when = ["exp.E2.types_parity.pass == 1", "exp.E2.errors_parity.pass == 1"]

[[item]]
id = "S08-3"
title = "Comparators ported line by line (ADR 0010); the union-ordering sub-test; the residual id-sensitive fixtures"
kind = "task"
required = true
done_when = ["exp.E2.comparators.pass == 1"]

[[item]]
id = "S08-4"
title = "Printer and node-builder slices for typeToString"
kind = "task"
required = true
done_when = ["run.e2.type_to_string_parity == 1"]

[[item]]
id = "S08-5"
title = "Deep recursion (ADR 0011) and reentrancy fixtures: reserved stacks, growth guards and the pushTypeResolution guard"
kind = "task"
required = true
done_when = ["run.e2.recursion_fixtures == true"]

[[item]]
id = "S08-6"
title = "Baseline divergence allow-list (ADR 0004, data/divergences.toml): every difference the comparison accepts has an owner-approved entry"
kind = "task"
required = true
done_when = ["exp.E2.divergences_approved.pass == 1"]

[[item]]
id = "S08-7"
title = "Per-type footprint on the subset, Rust against Go"
kind = "task"
required = true
done_when = ["exp.E5.type_footprint.pass == 1"]

[[item]]
id = "S08-8"
title = "E4 integration through production literal-type construction and original-source versus regenerated literal printing, including WTF-8 and malformed input"
kind = "task"
required = true
done_when = ["exp.E4.token_literal_bytes.pass == 1", "exp.E4.helper_printer_semantics.pass == 1"]

[[item]]
id = "S08-9"
title = "Measure checker throughput, bytes allocated and retained bytes against the pinned Go checker on a fixed query workload; retain raw samples and configuration with the evidence, separate from parse-and-bind results"
kind = "task"
required = true
done_when = ["exp.E2.checker_throughput.pass == 1", "exp.E2.checker_allocated_bytes.pass == 1", "exp.E2.checker_retained_bytes.pass == 1"]

[[item]]
id = "S08-10"
title = "Prototype the arena-reference/interior-mutability relater (ADR 0008), require parity on the frozen relater fixtures, and compare throughput, allocations and retained bytes with the id-and-&mut-self implementation on those same fixtures"
kind = "task"
required = true
done_when = ["exp.E2.relater_prototype_parity.pass == 1", "exp.E2.relater_throughput.pass == 1", "exp.E2.relater_allocated_bytes.pass == 1", "exp.E2.relater_retained_bytes.pass == 1"]
