# Phase 0, sprint 7. Producers to register: binder (cases = corpus), program, e5, e6, and the
# frozen_subset metric of e2.
#   run.binder.parity                symbol tables, flow nodes and bind diagnostics per file match the oracle
#   run.program.subset_loads         the in-memory host loads every frozen-subset case with its pinned lib files
#   run.e5.peak_rss_ratio            Rust / Go peak RSS, parse and bind of the pinned VS Code workload
#   run.e5.allocated_bytes_ratio     Rust / Go bytes allocated for the same workload
#   run.e6.one_thread_wall_time_ratio, run.e6.eight_threads_wall_time_ratio
#   run.e2.frozen_subset             the checked-in rule, manifest, options and exclusions match the denominator
# Owner amendment S07-3-2026-09-11-native-baseline-authority: the source inventory
# remains intact. data/s07/e2-acceptance.json separately marks native skips and
# rejected-option variants informational, outside E2 checker acceptance. These
# rows still participate in S07 loader/binder coverage and E7/E8 source selection.
# The VS Code commit is pinned in data/workloads.toml and declared as an input of e5 and e6.
id = "S07"
title = "Binder, resolution slice, program host, parse-and-bind benchmark"
goal = "Real binding with file-owned symbols, the module resolution and options the subset needs, an in-memory program host with the pinned libs, the frozen spike subset, and parse-and-bind memory and CPU against Go on the pinned VS Code workload."
exit = [
  "sprint.S06.done == 1",
  "run.binder.parity == 1",
  "run.binder.reached_bind == true",
  "run.binder.supplemental_parity == 1",
  "run.binder.protocol == true",
  "run.binder.helpers == true",
  "run.binder.resolvers == true",
  "run.binder.graph_contracts == true",
  "run.binder.depth == true",
  "run.bindworkload.parity == 1",
  "run.program.subset_loads == true",
  "exp.E2.frozen_subset.pass == 1",
  "exp.E3.shared_bound_file.pass == 1",
  "exp.E3.retained_snapshot_edit.pass == 1",
  "exp.E5.peak_rss.pass == 1",
  "exp.E5.allocated_bytes.pass == 1",
  "exp.E6.pass == 1",
  "run.e6.stable == true",
  "functions.package[internal/binder].ratio >= 0.9",
  "run.clippy.clean == true",
]

[[item]]
id = "S07-1"
title = "tsr_binder with file-owned symbols and flow nodes (ADR 0007); bind parity over the corpus against the oracle's symbol dump"
kind = "task"
required = true
done_when = ["run.binder.parity == 1", "run.binder.reached_bind == true", "run.binder.supplemental_parity == 1", "run.binder.protocol == true", "run.binder.helpers == true", "run.binder.resolvers == true", "run.binder.graph_contracts == true", "run.binder.depth == true"]

[[item]]
id = "S07-2"
title = "tsr_core, tsr_tsoptions, tsr_module and tsr_vfs slices; the in-memory program host; pinned lib loading through tsr_bundled; unsupported operations fail explicitly and are listed in the slice manifest"
kind = "task"
required = true
done_when = ["run.program.subset_loads == true"]

[[item]]
id = "S07-3"
title = "Frozen spike subset (PLAN.md, section 13, item 16): the checked-in rule, manifest, options, exclusions and the dependency operations E2, E7 and E8 need"
kind = "task"
required = true
done_when = ["exp.E2.frozen_subset.pass == 1"]

[[item]]
id = "S07-4"
title = "Parse-and-bind benchmark on the pinned VS Code workload, Rust against Go, at 1 and 8 threads, with peak RSS and bytes allocated"
kind = "task"
required = true
done_when = ["run.bindworkload.parity == 1", "exp.E5.peak_rss.pass == 1", "exp.E5.allocated_bytes.pass == 1", "exp.E6.one_thread.pass == 1", "exp.E6.eight_threads.pass == 1", "run.e6.stable == true"]

[[item]]
id = "S07-5"
title = "Program and snapshot owners in the E3 harness: a bound file shared by two programs; an edit while an old snapshot answers"
kind = "task"
required = true
done_when = ["exp.E3.shared_bound_file.pass == 1", "exp.E3.retained_snapshot_edit.pass == 1"]

[[item]]
id = "S07-6"
title = "Function-level traceability for the binder package"
kind = "task"
required = true
done_when = ["functions.package[internal/binder].ratio >= 0.9"]
