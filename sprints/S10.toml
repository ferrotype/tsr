# Phase 0, sprint 10. Registered replay producers: e7, e8.
#   run.e7.parser_artifact_size_ratio, run.e7.parse_throughput_ratio, run.e7.checker_parity, run.e7.portable_host
#   run.e8.node_parse_latency_ratio, run.e8.rust_consumer_parity, run.e8.lifetime_checks
# The Go GOOS=js parser baseline is built from the pin; the Rust consumer lives outside the workspace.
id = "S10"
title = "WebAssembly and Rust embedding"
goal = "The parser and the checker slice run as wasm32 with an in-memory host and are measured against Go's GOOS=js build; a separate Rust consumer and a Node adapter measure embedding on the subset and on the parse-and-encode path."
exit = [
  "sprint.S08.done == 1",
  "exp.E7.pass == 1",
  "exp.E8.pass == 1",
]

[[item]]
id = "S10-1"
title = "tsr_wasm: wasm32-unknown-unknown build of the parser and the checker slice with a portable in-memory host"
kind = "task"
required = true
done_when = ["exp.E7.portable_host.pass == 1", "exp.E7.checker_parity.pass == 1"]

[[item]]
id = "S10-2"
title = "Parser artifact size and parse throughput against Go GOOS=js"
kind = "task"
required = true
done_when = ["exp.E7.parser_artifact_size.pass == 1", "exp.E7.parse_throughput.pass == 1"]

[[item]]
id = "S10-3"
title = "tsr_embed crate API and a separate Rust consumer running the subset with repeated create, query and drop operations"
kind = "task"
required = true
done_when = ["exp.E8.rust_consumer_parity.pass == 1", "exp.E8.lifetime_checks.pass == 1"]

[[item]]
id = "S10-4"
title = "Node adapter: in-process parse-and-encode latency against the --api socket path for a 10 KB file"
kind = "task"
required = true
done_when = ["exp.E8.node_parse_latency.pass == 1"]
