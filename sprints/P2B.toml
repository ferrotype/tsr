# Phase 2, stage B: complete the type checker (C1-C7).
#
# Each checkpoint's detailed plan wires its own `done_when` metrics; until then
# an item names metrics no producer emits yet, so the sprint stays open by
# construction. The exit is PLAN's Phase 2 gate over the P2A denominator: every
# executed compiler/conformance variant matches in errors, types and symbols
# (approved divergences only), and the union-ordering and parent-pointer
# sub-tests pass; the owner also assigned the 148 module-resolution trace
# baselines to this gate (2026-09-25). Intermediate checkpoints run the
# recorded 300-variant sample of data/phase2/inventory.json; full runs are
# C0's gap map and C7's acceptance.
#
# A checkpoint's completion is a recorded fact (docs/PHASE2-C3-plan.md,
# section 3): C1, C2, C5 and C6 close on the checker run recorded at their
# exits, named by evidence id. C3 and C4 were never recorded while current, so
# they close on the final run: the P2B exit with no residual left
# (docs/PHASE2-C7-plan.md, decision 2).
id = "P2B"
title = "Phase 2 stage B: the complete type checker"
goal = "Every executed compiler and conformance variant matches the pinned checker in errors, types, symbols, display and the runner sub-tests, with checker execution, cancellation and the downstream checker contracts complete."
exit = [
  "sprint.P2A.done == 1",
  "run.checker.harness_valid == true",
  "run.checker.errors_parity == 1",
  "run.checker.types_parity == 1",
  "run.checker.symbols_parity == 1",
  "run.checker.display_parity == 1",
  "run.checker.trace_parity == 1",
  "run.checker.ordering == 1",
  "run.checker.parent_pointers == 1",
  "run.checker.unsupported_required == 0",
]

