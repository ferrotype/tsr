# Phase 3, stage A: the emit acceptance contract (T0). Preparation only; no
# Rust emit parity is claimed. docs/PHASE3-plan.md, section 4, defines the work.
#
# The `emit` producer (scripts/phase3_producers.py) replays the recorded native
# captures of both test-program modes and the Rust capture and emits:
#   run.emit.inventory_frozen, run.emit.native_verified,
#   run.emit.native_verified_concurrent, run.emit.transpile_native_verified,
#   run.emit.harness_valid, run.emit.result_recorded, run.emit.blockers_named.
#
# No threshold is introduced here. The Phase 2 producers and their metrics are
# untouched.
id = "P3A"
title = "Phase 3 stage A: the emit acceptance contract"
goal = "The Phase 3 denominator is frozen with what the pinned runner owes for each variant, the native emit contract is captured and verified in both test-program modes, one complete Rust run is recorded with every row categorized and harness-valid, and every withheld observation is a named blocker."
exit = [
  "run.emit.inventory_frozen == true",
  "run.emit.native_verified == true",
  "run.emit.native_verified_concurrent == true",
  "run.emit.harness_valid == true",
  "run.emit.result_recorded == true",
  "run.emit.blockers_named == true",
]

[[item]]
id = "P3A-T0"
title = "T0: inventory, native contract in both modes, categorized Rust run, blockers and wiring"
kind = "task"
required = true
done_when = [
  "run.emit.inventory_frozen == true",
  "run.emit.native_verified == true",
  "run.emit.native_verified_concurrent == true",
  "run.emit.harness_valid == true",
  "run.emit.result_recorded == true",
  "run.emit.blockers_named == true",
]
