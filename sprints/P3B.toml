# Phase 3, stage B: complete emit (T1-T8). docs/PHASE3-plan.md, sections 4 and 5.
#
# Each checkpoint closes on a recorded fact, `tN_complete`, on the emit run
# recorded at its exit; until a checkpoint wires that metric its item names one
# no producer emits yet, so the sprint stays open by construction. The exit is
# PLAN's Phase 3 gate over the P3A denominator: every executed compiler and
# conformance variant matches the pinned runner's output, source-map and
# source-map-record baselines and its emit diagnostics, the transpile runner's
# configurations match, the reprint witness matches, both test-program modes
# agree, and the Phase 2 gate still holds on the final sources. Intermediate
# checkpoints run the recorded 300-variant sample of the inventory; full runs
# are T0's first run and each checkpoint's exit.
id = "P3B"
title = "Phase 3 stage B: complete emit"
goal = "Every executed compiler and conformance variant emits what the pinned compiler emits: JavaScript, declarations, source maps and emit diagnostics, with the printer, the transforms, emit orchestration and transpile complete in both test-program modes."
exit = [
  "sprint.P3A.done == 1",
  "run.emit.harness_valid == true",
  "run.emit.harness_valid_concurrent == true",
  "run.emit.output_parity == 1",
  "run.emit.declaration_parity == 1",
  "run.emit.sourcemap_parity == 1",
  "run.emit.sourcemap_record_parity == 1",
  "run.emit.emit_diagnostics_parity == 1",
  "run.emit.transpile_parity == 1",
  "run.emit.reprint_parity == 1",
  "run.emit.mode_parity == true",
  "run.emit.unsupported_required == 0",
  "run.emit.residuals == 0",
  "run.checker.harness_valid == true",
  "run.checker.errors_parity == 1",
  "run.checker.types_parity == 1",
  "run.checker.symbols_parity == 1",
  "run.checker.display_parity == 1",
  "run.checker.trace_parity == 1",
  "run.checker.ordering == 1",
  "run.checker.parent_pointers == 1",
  "run.checker.unsupported_required == 0",
]

[[item]]
id = "P3B-T1"
title = "T1: the printer"
kind = "task"
required = true
done_when = ["run.emit.t1_complete == true"]

[[item]]
id = "P3B-T2"
title = "T2: source maps"
kind = "task"
required = true
done_when = ["run.emit.t2_complete == true"]

[[item]]
id = "P3B-T3"
title = "T3: the transform framework and the TypeScript transforms"
kind = "task"
required = true
done_when = ["run.emit.t3_complete == true"]

[[item]]
id = "P3B-T4"
title = "T4: module and inliner transforms"
kind = "task"
required = true
done_when = ["run.emit.t4_complete == true"]

[[item]]
id = "P3B-T5"
title = "T5: the ES downlevel transforms"
kind = "task"
required = true
done_when = ["run.emit.t5_complete == true"]

[[item]]
id = "P3B-T6"
title = "T6: the JSX transform"
kind = "task"
required = true
done_when = ["run.emit.t6_complete == true"]

[[item]]
id = "P3B-T7"
title = "T7: declaration emit"
kind = "task"
required = true
done_when = ["run.emit.t7_complete == true"]

[[item]]
id = "P3B-T8"
title = "T8: emit orchestration, transpile, both modes and closure"
kind = "task"
required = true
done_when = ["run.emit.t8_complete == true"]
