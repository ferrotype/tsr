[package]
name = "s09_format_harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "S09-3 formatter port: answers the native format oracle's requests with the Rust implementation, row for row"

[dependencies]
serde_json = "1"
sha2 = "0.10"
tsr_api = { version = "0.1.0", path = "../../../crates/tsr_api" }
tsr_arena = { version = "0.1.0", path = "../../../crates/tsr_arena" }
tsr_ast = { version = "0.1.0", path = "../../../crates/tsr_ast" }
tsr_astnav = { version = "0.1.0", path = "../../../crates/tsr_astnav" }
tsr_core = { version = "0.1.0", path = "../../../crates/tsr_core" }
tsr_encoder = { version = "0.1.0", path = "../../../crates/tsr_encoder" }
tsr_format = { version = "0.1.0", path = "../../../crates/tsr_format" }
tsr_jsstring = { version = "0.1.0", path = "../../../crates/tsr_jsstring" }
tsr_parser = { version = "0.1.0", path = "../../../crates/tsr_parser" }
tsr_printer = { version = "0.1.0", path = "../../../crates/tsr_printer" }

[lints]
workspace = true
