[package]
name = "s10_corpus"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Existing shared walker source declares these cfgs. Normal S10 builds leave
# measurement instrumentation off.
s08-phase-timer = []

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tsr_embed = { version = "0.1.0", path = "../../../crates/tsr_embed" }
tsr_arena = { version = "0.1.0", path = "../../../crates/tsr_arena" }
tsr_ast = { version = "0.1.0", path = "../../../crates/tsr_ast" }
tsr_checker = { version = "0.1.0", path = "../../../crates/tsr_checker" }
tsr_compiler = { version = "0.1.0", path = "../../../crates/tsr_compiler" }
tsr_core = { version = "0.1.0", path = "../../../crates/tsr_core" }
tsr_vfs = { version = "0.1.0", path = "../../../crates/tsr_vfs" }
tsr_bundled = { version = "0.1.0", path = "../../../crates/tsr_bundled" }
tsr_tsoptions = { version = "0.1.0", path = "../../../crates/tsr_tsoptions" }
tsr_tspath = { version = "0.1.0", path = "../../../crates/tsr_tspath" }
tsr_jsstring = { version = "0.1.0", path = "../../../crates/tsr_jsstring" }
tsr_printer = { version = "0.1.0", path = "../../../crates/tsr_printer" }
tsr_nodebuilder = { version = "0.1.0", path = "../../../crates/tsr_nodebuilder" }
tsr_module = { version = "0.1.0", path = "../../../crates/tsr_module" }
tsr_scanner = { version = "0.1.0", path = "../../../crates/tsr_scanner" }

[lints]
workspace = true
