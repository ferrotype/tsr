[package]
name = "s10_rust_consumer"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false

# Deliberately outside the implementation workspace: no inherited dependencies,
# features, lints or test access to private checker internals.
[workspace]

[dependencies]
tsr_embed = { version = "0.1.0", path = "../../../crates/tsr_embed" }
s10_corpus = { version = "0.1.0", path = "../corpus-adapter" }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
tsr_arena = { version = "0.1.0", path = "../../../crates/tsr_arena" }
tsr_checker = { version = "0.1.0", path = "../../../crates/tsr_checker" }
tsr_core = { version = "0.1.0", path = "../../../crates/tsr_core" }
tsr_jsstring = { version = "0.1.0", path = "../../../crates/tsr_jsstring" }
tsr_tsoptions = { version = "0.1.0", path = "../../../crates/tsr_tsoptions" }
tsr_vfs = { version = "0.1.0", path = "../../../crates/tsr_vfs" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
