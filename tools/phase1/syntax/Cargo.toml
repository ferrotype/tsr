[package]
name = "phase1_syntax"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Phase 1 F4a: answers the syntax schedule and the syntax, AST, navigation and evaluator requests with the production Rust implementations, row for row"

# A private harness, following tools/phase1/config. The schedule half loads a
# whole program through the shared S07 loader bridge, so it needs the loader's
# direct dependency set as well as the compiler.
[dependencies]
phase1_harness = { version = "0.1.0", path = "../harness" }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tsr_arena = { version = "0.1.0", path = "../../../crates/tsr_arena" }
tsr_ast = { version = "0.1.0", path = "../../../crates/tsr_ast" }
tsr_bundled = { version = "0.1.0", path = "../../../crates/tsr_bundled" }
tsr_compiler = { version = "0.1.0", path = "../../../crates/tsr_compiler" }
tsr_core = { version = "0.1.0", path = "../../../crates/tsr_core" }
tsr_jsstring = { version = "0.1.0", path = "../../../crates/tsr_jsstring" }
tsr_module = { version = "0.1.0", path = "../../../crates/tsr_module" }
tsr_tsoptions = { version = "0.1.0", path = "../../../crates/tsr_tsoptions" }
tsr_tspath = { version = "0.1.0", path = "../../../crates/tsr_tspath" }
tsr_vfs = { version = "0.1.0", path = "../../../crates/tsr_vfs" }

[lints]
workspace = true
