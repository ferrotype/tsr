[package]
name = "tsr_s07_access_trace_native_verify"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false

[workspace]
resolver = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = true

[lints.rust]
unsafe_code = "forbid"
