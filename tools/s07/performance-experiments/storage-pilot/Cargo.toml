[package]
name = "tsr_s07_storage_pilot"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false

[workspace]

[lib]
path = "lib.rs"

[[bin]]
name = "list-pilot"
path = "list_main.rs"

[features]
allocation = ["dep:cap"]

[dependencies]
cap = { version = "=0.1.2", features = ["stats"], optional = true }
mimalloc = "=0.1.48"
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "none"

[lints.rust]
unsafe_code = "forbid"
