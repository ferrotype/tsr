[package]
name = "tsr_memory_profile"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
publish = false

# Diagnostic tool: the production workspace and its acceptance binary stay intact.

[features]
sites = []

[dependencies]
cap = { version = "=0.1.2", features = ["stats"] }
mimalloc = "=0.1.48"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tsr_ast = { path = "../../crates/tsr_ast", version = "0.1.0" }
tsr_core = { path = "../../crates/tsr_core", version = "0.1.0" }
tsr_jsstring = { path = "../../crates/tsr_jsstring", version = "0.1.0" }
tsr_parser = { path = "../../crates/tsr_parser", version = "0.1.0" }
tsr_binder = { path = "../../crates/tsr_binder", version = "0.1.0" }

[profile.release]
opt-level = 3
debug = 2
debug-assertions = false
overflow-checks = false
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = "none"
split-debuginfo = "packed"

[lints.rust]
unsafe_code = "forbid"
