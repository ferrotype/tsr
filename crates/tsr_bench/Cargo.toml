[package]
name = "tsr_bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
profile = ["tsr_ast/layout-profile"]
allocation = ["dep:cap"]

[dependencies]
cap = { version = "=0.1.2", features = ["stats"], optional = true }
mimalloc = "=0.1.48"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tsr_arena = { path = "../tsr_arena", version = "0.1.0" }
tsr_ast = { path = "../tsr_ast", version = "0.1.0" }
tsr_binder = { path = "../tsr_binder", version = "0.1.0" }
tsr_core = { path = "../tsr_core", version = "0.1.0" }
tsr_jsstring = { path = "../tsr_jsstring", version = "0.1.0" }
tsr_parser = { path = "../tsr_parser", version = "0.1.0" }

[lints]
workspace = true

[[bin]]
name = "ts-bench"
path = "src/main.rs"

[[example]]
name = "allocation_probe"
required-features = ["allocation"]
