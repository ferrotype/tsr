[package]
name = "ts_bench"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
profile = ["ts_ast/layout-profile"]
allocation = ["dep:cap"]

[dependencies]
cap = { version = "=0.1.2", features = ["stats"], optional = true }
mimalloc = "=0.1.48"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ts_arena = { path = "../ts_arena", version = "0.1.0" }
ts_ast = { path = "../ts_ast", version = "0.1.0" }
ts_binder = { path = "../ts_binder", version = "0.1.0" }
ts_core = { path = "../ts_core", version = "0.1.0" }
ts_jsstring = { path = "../ts_jsstring", version = "0.1.0" }
ts_parser = { path = "../ts_parser", version = "0.1.0" }

[lints]
workspace = true

[[bin]]
name = "ts-bench"
path = "src/main.rs"

[[example]]
name = "allocation_probe"
required-features = ["allocation"]
