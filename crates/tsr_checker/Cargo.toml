[package]
name = "ts_checker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
storage-pilot = ["dep:serde_json"]
relation-probe = ["dep:serde_json"]

[dependencies]
stacker = "=0.1.25"
hashbrown = { version = "=0.17.1", default-features = false }
serde_json = { version = "1", optional = true }
ts_arena = { version = "0.1.0", path = "../ts_arena" }
ts_ast = { version = "0.1.0", path = "../ts_ast" }
ts_binder = { version = "0.1.0", path = "../ts_binder" }
ts_core = { version = "0.1.0", path = "../ts_core" }
ts_diagnostics = { version = "0.1.0", path = "../ts_diagnostics" }
ts_jsnum = { version = "0.1.0", path = "../ts_jsnum" }
ts_jsstring = { version = "0.1.0", path = "../ts_jsstring" }
ts_module = { version = "0.1.0", path = "../ts_module" }
ts_nodebuilder = { version = "0.1.0", path = "../ts_nodebuilder" }
ts_printer = { version = "0.1.0", path = "../ts_printer" }
ts_pseudochecker = { version = "0.1.0", path = "../ts_pseudochecker" }
ts_scanner = { version = "0.1.0", path = "../ts_scanner" }
ts_tsoptions = { version = "0.1.0", path = "../ts_tsoptions" }
ts_tspath = { version = "0.1.0", path = "../ts_tspath" }
ts_vfs = { version = "0.1.0", path = "../ts_vfs" }

[dev-dependencies]
serde_json = "1"
cap = { version = "=0.1.2", features = ["stats"] }
mimalloc = "=0.1.48"

[lints]
workspace = true

[[example]]
name = "storage_pilot"
required-features = ["storage-pilot"]

[[example]]
name = "storage_families"
required-features = ["storage-pilot"]
