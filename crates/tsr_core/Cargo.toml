[package]
name = "tsr_core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "Compiler primitives and collections for tsr"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE", "/licenses/**"]

[features]
default = []
# Explicit Go slice-header aliasing, used by the Phase 1 compatibility probes.
go-slice-compat = []

[dependencies]
tsr_jsstring = { path = "../tsr_jsstring", version = "0.1.0" }

[lints]
workspace = true
