[package]
name = "tsr"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Native TypeScript compiler command line"

[[bin]]
name = "tsrust"
path = "src/main.rs"

[features]
# Instrumentation must use the allocator intercepted by ThreadSanitizer.
system-allocator = []

[dependencies]
tsr_execute = { path = "../tsr_execute" }
tsr_tsc = { path = "../tsr_tsc" }
tsr_core = { path = "../tsr_core" }
tsr_bundled = { path = "../tsr_bundled" }
tsr_contentmapper = { path = "../tsr_contentmapper" }
tsr_ipc = { path = "../tsr_ipc" }
tsr_jsstring = { path = "../tsr_jsstring" }
tsr_vfs = { path = "../tsr_vfs" }
tsr_tspath = { path = "../tsr_tspath" }
# ADR 0017: the allocator the benchmark binary uses; the counters above it feed --diagnostics.
mimalloc = "=0.1.48"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "event", "pipe", "process", "termios"] }
libc = "0.2"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
