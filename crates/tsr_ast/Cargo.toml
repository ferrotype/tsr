[package]
name = "tsr_ast"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "TypeScript syntax trees, factories and binding storage for tsr"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE", "/licenses/**"]

[features]
layout-profile = []

[dependencies]
hashbrown = { version = "=0.17.1", default-features = false }
stacker = "=0.1.25"
tsr_core = { path = "../tsr_core", version = "0.1.0" }
tsr_diagnostics = { path = "../tsr_diagnostics", version = "0.1.0" }
tsr_arena = { path = "../tsr_arena", version = "0.1.0" }
tsr_jsnum = { path = "../tsr_jsnum", version = "0.1.0" }
tsr_jsstring = { path = "../tsr_jsstring", version = "0.1.0" }

[lints]
workspace = true
