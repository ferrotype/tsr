[package]
name = "ts_compiler"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
relation-probe = ["ts_checker/relation-probe"]
# S08 P7 measurement executables (`data/s08/checker-workload.json`): the normal
# timing binary has neither; phase timing adds nested exclusive clocks;
# allocation adds the counting allocator wrapper.
s08-phase-timer = []
s08-allocation = ["ts_checker/storage-pilot"]

[[example]]
name = "p3_relations"
required-features = ["relation-probe"]

[[example]]
name = "p3_comparators"
required-features = ["relation-probe"]

[[example]]
name = "p7_relater"
required-features = ["relation-probe"]

[[example]]
name = "p7_census"
required-features = ["s08-allocation"]

[dependencies]
stacker = "=0.1.25"
ts_core = { version = "0.1.0", path = "../ts_core" }
ts_tspath = { version = "0.1.0", path = "../ts_tspath" }
ts_vfs = { version = "0.1.0", path = "../ts_vfs" }
ts_bundled = { version = "0.1.0", path = "../ts_bundled" }
ts_tsoptions = { version = "0.1.0", path = "../ts_tsoptions" }
ts_module = { version = "0.1.0", path = "../ts_module" }
ts_arena = { version = "0.1.0", path = "../ts_arena" }
ts_ast = { version = "0.1.0", path = "../ts_ast" }
ts_parser = { version = "0.1.0", path = "../ts_parser" }
ts_scanner = { version = "0.1.0", path = "../ts_scanner" }
ts_binder = { version = "0.1.0", path = "../ts_binder" }
ts_transformers = { version = "0.1.0", path = "../ts_transformers" }
ts_printer = { version = "0.1.0", path = "../ts_printer" }
ts_checker = { version = "0.1.0", path = "../ts_checker" }
ts_jsstring = { version = "0.1.0", path = "../ts_jsstring" }
ts_diagnostics = { version = "0.1.0", path = "../ts_diagnostics" }

[lints]
workspace = true

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
ts_nodebuilder = { version = "0.1.0", path = "../ts_nodebuilder" }
serde_json = "1"
sha2 = "0.10"
mimalloc = "=0.1.48"
cap = { version = "=0.1.2", features = ["stats"] }
s08_relater_prototype = { version = "0.1.0", path = "../../tools/s08/relater-prototype" }
