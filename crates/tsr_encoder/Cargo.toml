[package]
name = "tsr_encoder"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "TypeScript syntax tree protocol encoding for ts-rust"
repository.workspace = true
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE", "/licenses/**"]

[dependencies]
tsr_ast = { path = "../tsr_ast", version = "0.1.0" }
tsr_arena = { path = "../tsr_arena", version = "0.1.0" }
tsr_core = { path = "../tsr_core", version = "0.1.0" }
tsr_jsstring = { path = "../tsr_jsstring", version = "0.1.0" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Repository-only codec fixtures; omit from archives to break the parser/encoder
# dev-dependency cycle during the first dependency-ordered release.
tsr_parser = { path = "../tsr_parser" }

[lints]
workspace = true
