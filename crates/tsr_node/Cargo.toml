[package]
name = "tsr_node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[features]
# Development attribution only; absent from the shipped adapter.
worker-probe = []

[dependencies]
napi = { version = "=3.12.2", default-features = false, features = ["napi8"] }
napi-derive = "=3.6.3"
tsr_parser = { version = "0.1.0", path = "../tsr_parser" }
tsr_embed = { version = "0.1.0", path = "../tsr_embed", default-features = false }
tsr_ast = { version = "0.1.0", path = "../tsr_ast" }
tsr_core = { version = "0.1.0", path = "../tsr_core" }
tsr_jsstring = { version = "0.1.0", path = "../tsr_jsstring" }

[build-dependencies]
napi-build = "=2.4.1"

# ADR 0016: this leaf owns the Node-API FFI generated by napi-derive. The
# implementation it calls remains in tsr_embed under the workspace unsafe ban.
[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
needless_pass_by_value = "allow" # Node-API owns argument buffers for the callback.
