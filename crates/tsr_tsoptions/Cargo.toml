[package]
name = "tsr_tsoptions"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "TypeScript compiler options and configuration parsing for tsr"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE", "/licenses/**"]

[dependencies]
tsr_json = { path = "../tsr_json", version = "0.1.0" }
stacker = "=0.1.25"
tsr_jsnum = { version = "0.1.0", path = "../tsr_jsnum" }
tsr_ast = { version = "0.1.0", path = "../tsr_ast" }
tsr_parser = { version = "0.1.0", path = "../tsr_parser" }
tsr_scanner = { version = "0.1.0", path = "../tsr_scanner" }
tsr_vfs = { version = "0.1.0", path = "../tsr_vfs" }
tsr_core = { version = "0.1.0", path = "../tsr_core" }
tsr_tspath = { version = "0.1.0", path = "../tsr_tspath" }
tsr_bundled = { version = "0.1.0", path = "../tsr_bundled" }
tsr_diagnostics = { version = "0.1.0", path = "../tsr_diagnostics" }
tsr_jsstring = { version = "0.1.0", path = "../tsr_jsstring" }
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
