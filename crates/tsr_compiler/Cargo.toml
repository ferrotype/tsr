[package]
name = "tsr_compiler"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "TypeScript program loading, diagnostics and compiler orchestration for tsr"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE", "/licenses/**"]

[features]
relation-probe = ["tsr_checker/relation-probe"]
recursion-probe = ["relation-probe", "tsr_checker/recursion-probe"]
creation-trace = ["relation-probe", "tsr_checker/creation-trace"]
# S08 P7 measurement executables (`data/s08/checker-workload.json`): the normal
# timing binary has neither; phase timing adds nested exclusive clocks;
# allocation adds the counting allocator wrapper.
s08-phase-timer = []
s08-allocation = ["tsr_checker/storage-pilot"]

[[test]]
name = "c1_contracts"
required-features = ["recursion-probe"]

[[test]]
name = "c2_review_fixes"
required-features = ["relation-probe"]

[[example]]
name = "p3_relations"
required-features = ["relation-probe"]

[[example]]
name = "c2_order_trace"
required-features = ["relation-probe"]

[[example]]
name = "p3_comparators"
required-features = ["relation-probe"]

[[example]]
name = "p7_relater"
required-features = ["relation-probe"]

[[example]]
name = "p7_census"
required-features = ["s08-allocation"]

[dependencies]
stacker = "=0.1.25"
tsr_core = { version = "0.1.0", path = "../tsr_core" }
tsr_tspath = { version = "0.1.0", path = "../tsr_tspath" }
tsr_vfs = { version = "0.1.0", path = "../tsr_vfs" }
tsr_bundled = { version = "0.1.0", path = "../tsr_bundled" }
tsr_tsoptions = { version = "0.1.0", path = "../tsr_tsoptions" }
tsr_module = { version = "0.1.0", path = "../tsr_module" }
tsr_arena = { version = "0.1.0", path = "../tsr_arena" }
tsr_ast = { version = "0.1.0", path = "../tsr_ast" }
tsr_parser = { version = "0.1.0", path = "../tsr_parser" }
tsr_scanner = { version = "0.1.0", path = "../tsr_scanner" }
tsr_binder = { version = "0.1.0", path = "../tsr_binder" }
tsr_transformers = { version = "0.1.0", path = "../tsr_transformers" }
tsr_printer = { version = "0.1.0", path = "../tsr_printer" }
tsr_checker = { version = "0.1.0", path = "../tsr_checker" }
tsr_jsstring = { version = "0.1.0", path = "../tsr_jsstring" }
tsr_diagnostics = { version = "0.1.0", path = "../tsr_diagnostics" }
tsr_locale = { version = "0.1.0", path = "../tsr_locale" }

[lints]
workspace = true

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
tsr_nodebuilder = { version = "0.1.0", path = "../tsr_nodebuilder" }
serde_json = "1"
sha2 = "0.10"
mimalloc = "=0.1.48"
cap = { version = "=0.1.2", features = ["stats"] }
s08_relater_prototype = { path = "../../tools/s08/relater-prototype" }
