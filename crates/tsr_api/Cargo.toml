[package]
name = "tsr_api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tsr_arena = { version = "0.1.0", path = "../tsr_arena" }
tsr_ast = { version = "0.1.0", path = "../tsr_ast" }
tsr_checker = { version = "0.1.0", path = "../tsr_checker" }
tsr_core = { version = "0.1.0", path = "../tsr_core" }
tsr_encoder = { version = "0.1.0", path = "../tsr_encoder" }
tsr_format = { version = "0.1.0", path = "../tsr_format" }
tsr_printer = { version = "0.1.0", path = "../tsr_printer" }
tsr_project = { version = "0.1.0", path = "../tsr_project" }

[dev-dependencies]
tsr_arena = { version = "0.1.0", path = "../tsr_arena", features = ["harness"] }
serde_json = "1"
tsr_jsstring = { version = "0.1.0", path = "../tsr_jsstring" }
tsr_parser = { version = "0.1.0", path = "../tsr_parser" }

[lints]
workspace = true
