[package]
name = "tsr_transpile"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "Single-file JavaScript and declaration emit (transpileModule, transpileDeclaration) for tsr"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE", "/licenses/**"]

[dependencies]
tsr_arena = { version = "0.3.0", path = "../tsr_arena" }
tsr_ast = { version = "0.3.0", path = "../tsr_ast" }
tsr_checker = { version = "0.3.0", path = "../tsr_checker" }
tsr_compiler = { version = "0.3.0", path = "../tsr_compiler" }
tsr_core = { version = "0.3.0", path = "../tsr_core" }
tsr_jsstring = { version = "0.3.0", path = "../tsr_jsstring" }
tsr_tsoptions = { version = "0.3.0", path = "../tsr_tsoptions" }
tsr_tspath = { version = "0.3.0", path = "../tsr_tspath" }
tsr_vfs = { version = "0.3.0", path = "../tsr_vfs" }

[dev-dependencies]
# The transpile runner's harness (examples/phase3_transpile.rs and its test)
# reads the native capture's JSON; the ported error writer writes it too.
serde_json = "1"

[lints]
workspace = true
