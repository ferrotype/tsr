[package]
name = "tsrust"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "tsrust, the tsr command line: TypeScript's native compiler in Rust, with the same arguments as tsc"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE", "/licenses/**"]

[[bin]]
name = "tsrust"
path = "src/main.rs"

[features]
# Instrumentation must use the allocator intercepted by ThreadSanitizer.
system-allocator = []

[dependencies]
tsr_json = { version = "0.2.0", path = "../tsr_json" }
tsr_lsproto = { version = "0.2.0", path = "../tsr_lsproto" }
tsr_project = { version = "0.2.0", path = "../tsr_project" }
tsr_lsp = { version = "0.2.0", path = "../tsr_lsp" }
tsr_execute = { version = "0.2.0", path = "../tsr_execute" }
tsr_tsc = { version = "0.2.0", path = "../tsr_tsc" }
tsr_core = { version = "0.2.0", path = "../tsr_core" }
tsr_bundled = { version = "0.2.0", path = "../tsr_bundled" }
tsr_contentmapper = { version = "0.2.0", path = "../tsr_contentmapper" }
tsr_ipc = { version = "0.2.0", path = "../tsr_ipc" }
tsr_jsstring = { version = "0.2.0", path = "../tsr_jsstring" }
tsr_vfs = { version = "0.2.0", path = "../tsr_vfs" }
tsr_tspath = { version = "0.2.0", path = "../tsr_tspath" }
# ADR 0017: the allocator the benchmark binary uses; the counters above it feed --diagnostics.
mimalloc = "=0.1.48"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "event", "pipe", "process", "termios"] }
libc = "0.2"

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
