[package]
name = "ts_wasm"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
checker = ["ts_embed/checker", "dep:ts_compiler", "dep:ts_checker", "dep:ts_vfs", "dep:ts_bundled", "dep:ts_tsoptions", "dep:ts_astnav", "dep:serde_json"]
# Capture-only native walker, separate from the shipped checker interface.
corpus = ["checker", "dep:s10_corpus"]

[dependencies]
wasm-bindgen = "=0.2.126"
ts_arena = { version = "0.1.0", path = "../ts_arena" }
ts_ast = { version = "0.1.0", path = "../ts_ast" }
ts_core = { version = "0.1.0", path = "../ts_core" }
ts_encoder = { version = "0.1.0", path = "../ts_encoder" }
ts_jsstring = { version = "0.1.0", path = "../ts_jsstring" }
ts_parser = { version = "0.1.0", path = "../ts_parser" }
ts_embed = { version = "0.1.0", path = "../ts_embed", default-features = false }
ts_compiler = { version = "0.1.0", path = "../ts_compiler", optional = true }
ts_checker = { version = "0.1.0", path = "../ts_checker", optional = true }
ts_vfs = { version = "0.1.0", path = "../ts_vfs", optional = true }
ts_bundled = { version = "0.1.0", path = "../ts_bundled", optional = true }
ts_tsoptions = { version = "0.1.0", path = "../ts_tsoptions", optional = true }
ts_astnav = { version = "0.1.0", path = "../ts_astnav", optional = true }
serde_json = { version = "1", features = ["preserve_order"], optional = true }
s10_corpus = { version = "0.1.0", path = "../../tools/s10/corpus-adapter", optional = true }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
