[package]
name = "ts_node"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
napi = { version = "=3.12.2", default-features = false, features = ["napi8"] }
napi-derive = "=3.6.3"
ts_parser = { version = "0.1.0", path = "../ts_parser" }
ts_embed = { version = "0.1.0", path = "../ts_embed", default-features = false }
ts_ast = { version = "0.1.0", path = "../ts_ast" }
ts_core = { version = "0.1.0", path = "../ts_core" }
ts_jsstring = { version = "0.1.0", path = "../ts_jsstring" }

[build-dependencies]
napi-build = "=2.4.1"

# ADR 0016: this leaf owns the Node-API FFI generated by napi-derive. The
# implementation it calls remains in ts_embed under the workspace unsafe ban.
[lints.rust]
unsafe_code = "deny"
rust_2018_idioms = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
needless_pass_by_value = "allow" # Node-API owns argument buffers for the callback.
