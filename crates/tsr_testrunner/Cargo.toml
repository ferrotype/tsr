[package]
name = "tsr_testrunner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "The pinned compiler and transpile test runners over the Rust compiler: test-case parsing, harness compilation, the baseline writers and the comparison with testdata/baselines/reference (docs/EVIDENCE-plan.md)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tsr-testrunner"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tsr_arena = { path = "../tsr_arena" }
tsr_ast = { path = "../tsr_ast" }
tsr_astnav = { path = "../tsr_astnav" }
tsr_bundled = { path = "../tsr_bundled" }
tsr_checker = { path = "../tsr_checker" }
tsr_compiler = { path = "../tsr_compiler" }
tsr_contentmapper = { path = "../tsr_contentmapper" }
tsr_contentmappertest = { path = "../tsr_contentmappertest" }
tsr_core = { path = "../tsr_core" }
tsr_diagnostics = { path = "../tsr_diagnostics" }
tsr_incremental = { path = "../tsr_incremental" }
tsr_ipc = { path = "../tsr_ipc" }
tsr_json = { path = "../tsr_json" }
tsr_jsstring = { path = "../tsr_jsstring" }
tsr_locale = { path = "../tsr_locale" }
tsr_module = { path = "../tsr_module" }
tsr_nodebuilder = { path = "../tsr_nodebuilder" }
tsr_parser = { path = "../tsr_parser" }
tsr_printer = { path = "../tsr_printer" }
tsr_scanner = { path = "../tsr_scanner" }
tsr_sourcemap = { path = "../tsr_sourcemap" }
tsr_transpile = { path = "../tsr_transpile" }
tsr_tsoptions = { path = "../tsr_tsoptions" }
tsr_tspath = { path = "../tsr_tspath" }
tsr_vfs = { path = "../tsr_vfs" }

# Diagnostic branch: the fatal-signal tracer is the one module that needs
# unsafe code, as in tsr_fswatch; the workspace forbids it everywhere else.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
