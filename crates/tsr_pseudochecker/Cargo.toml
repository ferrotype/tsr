[package]
name = "tsr_pseudochecker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = ["crates-io"]
description = "Syntax-based type builder support for tsr"
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"
include = ["/src/**", "/Cargo.toml", "/README.md", "/LICENSE", "/NOTICE", "/licenses/**"]

[dependencies]
stacker = "=0.1.25"
tsr_ast = { version = "0.1.0", path = "../tsr_ast" }
tsr_arena = { version = "0.1.0", path = "../tsr_arena" }

[dev-dependencies]
serde_json = "1"
tsr_parser = { version = "0.1.0", path = "../tsr_parser" }
tsr_binder = { version = "0.1.0", path = "../tsr_binder" }
tsr_core = { version = "0.1.0", path = "../tsr_core" }
tsr_jsstring = { version = "0.1.0", path = "../tsr_jsstring" }

[lints]
workspace = true
