# Baseline divergence allow-list (ADR 0004). The owner approves every entry.
#
# An E2 case whose output differs from the Corsa baseline passes only when the
# difference is covered by an entry here. The e2 producer declares this file as
# an input, so a change here invalidates its evidence and the comparison reruns.
# Approving an entry never edits a baseline: baselines stay the pinned upstream's.
#
# Entry shape:
#
# [[divergence]]
# id = "D001"
# domain = "e2"                                             # default; phase4 for CLI transcripts
# title = "one line"
# scope = ["conformance/types/union/unionTypeMembers.ts"]   # baseline cases or globs
# kind = "ordering"                                          # ordering | message | position | emit | other
# rationale = "why the Rust output differs and why that is acceptable"
# approved_by = "owner"
# approved_on = "2026-09-05"
# upstream_pin = "1f70213d4922b434345f639b441681e470c7cfc1"
# observations = [{ variant_id = "exact frozen variant id", metric = "errors_parity", native_sha256 = "64 hex digits", rust_sha256 = "64 hex digits" }]
#
# E2 scopes match frozen variant IDs. Every accepted difference also needs an
# exact observation witness copied from the E2 comparison report. A glob alone
# never approves changed output. Failures, missing operations and native-unavailable
# cases cannot be waived. Unused or changed acceptance witnesses prevent the
# approval gate; informational witnesses are reported without affecting gates.

# Phase 4's transcript approvals use the same schema and registry. `variant_id`
# is the exact scenario identity; `baseline_parity` hashes the complete transcript.
# Owner approval recorded in docs/PHASE4-X6.md and Phase 4 decision 15.
[[divergence]]
id = "P4-eager-bind-trace-order"
domain = "phase4"
title = "Eager binding changes the parse/bind trace prefix"
scope = ["tsc/generateTrace/generateTrace-generates-types-file.js", "tsc/generateTrace/generateTrace-with-multiple-files-and-complex-types.js"]
kind = "ordering"
rationale = "Rust binds each exclusive parsed file before publication during loading; Go binds published files later. The owner approved retaining this S07 design. Only the createProgram/parse/bind trace prefix differs; type dumps, legend, diagnostics, emitted bytes and subsequent check/emit events match. Approval covers only the exact paired whole-transcript hashes below."
approved_by = "owner"
approved_on = "2026-10-02"
upstream_pin = "1f70213d4922b434345f639b441681e470c7cfc1"

