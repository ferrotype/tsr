# Phase 0 gates from PLAN.md, section 9. Every criterion is required.
# Metrics come from successful, current evidence runs, never handwritten results.
# No e1-e8 runner is registered until its actual harness exists; missing evidence
# remains unknown and cannot pass. Keep workload limits in `nature`.

[E1]
title = "Parser parity"
nature = "Measured across the frozen 12,721-case corpus and 108 lib files"

[[E1.criteria]]
id = "encoder_parity"
metric = "run.e1.parity"
op = ">="
threshold = 0.999
unit = "encoder-identical cases / frozen eligible cases"

[[E1.criteria]]
id = "frozen_denominator"
metric = "run.e1.frozen_denominator"
op = "=="
threshold = true
unit = "manifest and options match the committed denominator; no skipped cases"

[E2]
title = "Checker slice"
nature = "Measured on the owner-amended E2 acceptance partition; native skips and rejected-option differentials are informational only (S07-3-2026-09-11-native-baseline-authority); throughput, allocations and retained memory are reported separately from parser results"

[[E2.criteria]]
id = "types_parity"
metric = "run.e2.types_parity"
op = "=="
threshold = 1
unit = "matching .types outcomes / E2 acceptance variants"

[[E2.criteria]]
id = "errors_parity"
metric = "run.e2.errors_parity"
op = "=="
threshold = 1
unit = "matching .errors.txt outcomes / E2 acceptance variants"

[[E2.criteria]]
id = "comparators"
metric = "run.e2.comparators"
op = "=="
threshold = true
unit = "comparator consistency and residual ID-sensitive fixtures pass"

[[E2.criteria]]
id = "frozen_subset"
metric = "run.e2.frozen_subset"
op = "=="
threshold = true
unit = "the complete source inventory and owner-approved E2 acceptance/informational partition match the committed S07-3 review; no missing required variants"

[[E2.criteria]]
id = "divergences_approved"
metric = "run.e2.divergences_approved"
op = "=="
threshold = true
unit = "every baseline difference the comparison accepts is covered by an owner-approved entry in data/divergences.toml (ADR 0004)"

[[E2.criteria]]
id = "checker_throughput"
metric = "run.checkerbench.throughput_ratio"
op = ">"
threshold = 0
unit = "measured Rust/Go checker throughput on the frozen query workload; positive finite measurement, not a speed target"

[[E2.criteria]]
id = "checker_allocated_bytes"
metric = "run.checkerbench.allocated_bytes_ratio"
op = ">="
threshold = 0
unit = "measured Rust/Go bytes allocated during the fixed checker query phase, with raw samples and a positive Go denominator"

[[E2.criteria]]
id = "checker_retained_bytes"
metric = "run.checkerbench.retained_bytes_ratio"
op = ">="
threshold = 0
unit = "measured Rust/Go retained bytes with the declared checker/result roots alive after the fixed query phase, with raw samples and a positive Go denominator"

[[E2.criteria]]
id = "relater_prototype_parity"
metric = "run.relater.parity"
op = "=="
threshold = 1
unit = "ID-based and arena-reference/interior-mutability relaters both match the pinned oracle over every frozen prototype case; no skipped cases"

[[E2.criteria]]
id = "relater_throughput"
metric = "run.relater.throughput_ratio"
op = ">"
threshold = 0
unit = "measured arena-reference/ID-based relater throughput on identical frozen cases; positive finite measurement, not a speed target"

[[E2.criteria]]
id = "relater_allocated_bytes"
metric = "run.relater.allocated_bytes_ratio"
op = ">="
threshold = 0
unit = "measured arena-reference/ID-based relater allocations with raw samples and positive baseline bytes; required comparison, not a performance target"

[[E2.criteria]]
id = "relater_retained_bytes"
metric = "run.relater.retained_bytes_ratio"
op = ">="
threshold = 0
unit = "measured arena-reference/ID-based retained bytes at the same declared live-root checkpoint; required comparison with positive baseline bytes"

[E3]
title = "Ownership"
nature = "Measured in the ownership harness; repeated through real servers in Phases 5/6. RSS is reported, not required to fall after each drop"

[[E3.criteria]]
id = "shared_bound_file"
metric = "run.e3.shared_bound_file"
op = "=="
threshold = true
unit = "two programs share a bound file; surviving queries pass after either program drops"

[[E3.criteria]]
id = "retained_snapshot_edit"
metric = "run.e3.retained_snapshot_edit"
op = "=="
threshold = true
unit = "old and new snapshots answer correctly across an edit"

[[E3.criteria]]
id = "independent_checker_merges"
metric = "run.e3.independent_checker_merges"
op = "=="
threshold = true
unit = "two checkers independently merge declarations over shared files"

[[E3.criteria]]
id = "concurrent_lazy_storage"
metric = "run.e3.concurrent_lazy_storage"
op = "=="
threshold = true
unit = "same-lock cache lookup/publication, miss recheck and page growth preserve initialized nodes, supplied token parents and file ownership under concurrent first use"

[[E3.criteria]]
id = "mapper_bundle_disposal"
metric = "run.e3.mapper_bundle_disposal"
op = "=="
threshold = true
unit = "multi-output content-mapper bundles survive varied owner-release orders"

[[E3.criteria]]
id = "builder_cache_retention"
metric = "run.e3.builder_cache_retention"
op = "=="
threshold = true
unit = "cache, persistent emit-table keys/values and returned-handle dependencies retain builder generations; cloning A into B preserves original links after A's cache entry drops"

[[E3.criteria]]
id = "checker_result_retention"
metric = "run.e3.checker_result_retention"
op = "=="
threshold = true
unit = "retained types, signatures, symbols and lists preserve exact checker identity and storage after lease release or idle-slot replacement, without self-owning cycles"

[[E3.criteria]]
id = "checker_ast_retention"
metric = "run.e3.checker_ast_retention"
op = "=="
threshold = true
unit = "checker synthetic expressions and signature declarations retain exact-checker type, AST and file/bundle dependencies across builder release"

[[E3.criteria]]
id = "api_scratch_disposal"
metric = "run.e3.api_scratch_disposal"
op = "=="
threshold = true
unit = "repeated API printing and insertion formatting match Go and release request scratch without synthetic handles or session arena growth"

[[E3.criteria]]
id = "id_exhaustion"
metric = "run.e3.id_exhaustion"
op = "=="
threshold = true
unit = "node/symbol identity survives the 31-bit boundary; arena and slot allocation reject exhaustion before u32 wrap, reuse or zero-slot publication"

[[E3.criteria]]
id = "wrong_owner_rejected"
metric = "run.e3.wrong_owner_rejected"
op = "=="
threshold = true
unit = "every wrong-file and wrong-checker handle is rejected, including equal numeric slots in two active checkers of one pool generation"

[[E3.criteria]]
id = "stale_and_recycled_ids_rejected"
metric = "run.e3.stale_and_recycled_ids_rejected"
op = "=="
threshold = true
unit = "every stale and recycled owner/generation identity is rejected"

[[E3.criteria]]
id = "shared_pool_panic_retirement"
metric = "run.e3.shared_pool_panic_retirement"
op = "=="
threshold = true
unit = "panic through one snapshot retires the shared pool in all dependent snapshots, projects, leases, retained results and registries; forced publication interleavings commit no retired success or handles and preserve lock order"

[[E3.criteria]]
id = "owners_return_to_baseline"
metric = "run.e3.live_owner_delta"
op = "=="
threshold = 0
unit = "maximum absolute live-owner count deviation from the pre-scenario baseline after final owner, lease, cache, emit-table, retained-result and registry-root drops"

[[E3.criteria]]
id = "allocations_return_to_baseline"
metric = "run.e3.live_allocation_delta"
op = "=="
threshold = 0
unit = "maximum absolute live-allocation count deviation from the pre-scenario baseline after final owner, lease, cache, emit-table, retained-result and registry-root drops"

[[E3.criteria]]
id = "miri"
metric = "run.e3.miri"
op = "=="
threshold = true
unit = "applicable ownership scenarios pass under Miri"

[[E3.criteria]]
id = "address_sanitizer"
metric = "run.e3.address_sanitizer"
op = "=="
threshold = true
unit = "ownership scenarios pass under AddressSanitizer"

[[E3.criteria]]
id = "release_boundaries"
metric = "run.e3.release_boundaries"
op = "=="
threshold = true
unit = "release builds reject stale/wrong-owner cache, cross-arena and reentrant handles and suppress results from retired generations; debug assertions also pass"

[E4]
title = "Strings"
nature = "Measured over corpus literals and the text design note's helper/printer, byte-slice, BOM, malformed-byte, surrogate, partial-position and line-map fixtures"

[[E4.criteria]]
id = "source_decoding"
metric = "run.e4.source_decoding"
op = "=="
threshold = true
unit = "source bytes, BOM removal and UTF-16 decoding match Go"

[[E4.criteria]]
id = "diagnostics"
metric = "run.scanner.diagnostics"
op = "=="
threshold = true
unit = "scanner and scanned-literal diagnostic callbacks match Go on successful and malformed input; AST diagnostic integration remains separate"

[[E4.criteria]]
id = "token_literal_bytes"
metric = "run.checkertext.token_literal_bytes"
op = "=="
threshold = true
unit = "token bytes, literal values and literal types match Go, including explicit upstream transformations without added lossy repair"

[[E4.criteria]]
id = "helper_printer_semantics"
metric = "run.checkertext.helper_printer_semantics"
op = "=="
threshold = true
unit = "case mapping and truncation preserve Go's replacements/fragments; original-source and regenerated literal paths reproduce its distinct copy/escape behavior"

[[E4.criteria]]
id = "slice_validity"
metric = "run.e4.slice_validity"
op = "=="
threshold = true
unit = "byte slices of UTF-8/WTF-8 strings remain representable and are reclassified when endpoints split a sequence; str views require valid slice boundaries"

[[E4.criteria]]
id = "utf8_positions"
metric = "run.e4.utf8_positions"
op = "=="
threshold = true
unit = "byte offsets, UTF-8 wire positions and distinct ECMAScript/LSP line maps match Go, including U+2028/U+2029 and range handling"

[[E4.criteria]]
id = "utf16_positions"
metric = "run.e4.utf16_positions"
op = "=="
threshold = true
unit = "API/LSP/scanner UTF-16 conversions match Go separately, including astral offset 1 to bytes 1/0/4, sentinel counting, partial byte prefixes and clamp/panic behavior"

[[E4.criteria]]
id = "encoder_success_error"
metric = "run.e1.encoder_success_error"
op = "=="
threshold = true
unit = "encoder success/error outcomes match Go, including malformed bytes"

[[E4.criteria]]
id = "encoder_output_bytes"
metric = "run.e1.encoder_output_bytes"
op = "=="
threshold = true
unit = "byte-identical encoder output wherever Go encodes successfully"

[[E4.criteria]]
id = "helper_semantics"
metric = "run.e4.helper_semantics"
op = "=="
threshold = true
unit = "leaf case mapping, truncation and escape helpers match Go replacements and fragments; actual source-reuse/regenerated printer integration remains a separate requirement"

[[E4.criteria]]
id = "token_value_bytes"
metric = "run.scanner.token_value_bytes"
op = "=="
threshold = true
unit = "scanner token bytes, literal value bytes and rescans match Go; checker-created literal types remain a separate integration requirement"

[E5]
title = "Memory"
nature = "Measured for parse/bind and the checker subset's per-type footprint; full checking remains extrapolated. Parse/bind thresholds re-based by ADR 0021 (2026-09-10) from 0.7; per-type footprint re-based by owner decision ADR 0022 (2026-09-18) from 0.8"

[[E5.criteria]]
id = "peak_rss"
metric = "run.e5.peak_rss_ratio"
op = "<="
threshold = 0.85
unit = "Rust / Go peak RSS for parse and bind of the pinned VS Code workload"

[[E5.criteria]]
id = "allocated_bytes"
metric = "run.e5.allocated_bytes_ratio"
op = "<="
threshold = 0.85
unit = "Rust / Go bytes allocated for the same parse/bind workload"

[[E5.criteria]]
id = "type_footprint"
metric = "run.e5.type_footprint_ratio"
op = "<="
threshold = 0.85
unit = "Rust / Go per-type footprint on the frozen checker subset"

[E6]
title = "CPU"
nature = "Measured for parse and bind of the pinned VS Code workload; full checking remains extrapolated. Thresholds re-based by ADR 0021 (2026-09-10) from 1.0; run.e6.stable applies each mode's threshold"

[[E6.criteria]]
id = "one_thread"
metric = "run.e6.one_thread_wall_time_ratio"
op = "<="
threshold = 1.25
unit = "Rust / Go wall time at one thread"

[[E6.criteria]]
id = "eight_threads"
metric = "run.e6.eight_threads_wall_time_ratio"
op = "<="
threshold = 1.45
unit = "Rust / Go wall time at eight threads"

[E7]
title = "WebAssembly"
nature = "Parser performance and checker-slice feasibility measured separately; full checking/emit parity and speed are not established"

[[E7.criteria]]
id = "parser_artifact_size"
metric = "run.e7.parser_artifact_size_ratio"
op = "<="
threshold = 0.25
unit = "Rust wasm32 / Go GOOS=js parser artifact bytes"

[[E7.criteria]]
id = "parse_throughput"
metric = "run.e7.parse_throughput_ratio"
op = ">="
threshold = 2
unit = "Rust / Go parse throughput"

[[E7.criteria]]
id = "checker_parity"
metric = "run.e7.checker_parity"
op = "=="
threshold = 1
unit = "frozen E2 cases matching both diagnostics and types / frozen E2 cases"

[[E7.criteria]]
id = "portable_host"
metric = "run.e7.portable_host"
op = "=="
threshold = true
unit = "checker subset runs using an in-memory host without native process/filesystem dependencies"

[E8]
title = "Embedding"
nature = "Separate Rust consumer feasibility and Node parse latency measured separately; full crate surface and workload budgets remain Phase 7 gates"

[[E8.criteria]]
id = "node_parse_latency"
metric = "run.e8.node_parse_latency_ratio"
op = "<="
threshold = 0.1
unit = "Node in-process / --api socket parse-and-encode latency for a 10 KB file"

[[E8.criteria]]
id = "rust_consumer_parity"
metric = "run.e8.rust_consumer_parity"
op = "=="
threshold = 1
unit = "frozen E2 cases matching diagnostics and types through the separate Rust consumer / frozen E2 cases"

[[E8.criteria]]
id = "lifetime_checks"
metric = "run.e8.lifetime_checks"
op = "=="
threshold = true
unit = "consumer-supplied host passes applicable E3 checks through repeated create/query/drop operations"
