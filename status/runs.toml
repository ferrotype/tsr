# Commands emit one JSON object to stdout: {"metrics": { ... }}.
# The runner binds successful executions to command, inputs, target, configuration
# and repository provenance. Failed or stale runs cannot pass gates.
# E3 measures S04 arena, S06 AST, S07 program owners, S08 independent checker merges
# and S09 retention, request scratch and generation/pool/registry boundaries.
# These and the E4/E1 leaves remain scoped, not whole-experiment completion.

[testhost]
command = ["python3", "scripts/s11.py", "capture"]
inputs = ["data/upstream.json", ".gitmodules", "data/s04/toolchains.toml", "docs/S11.md"]
cases = "data/s11/cases.json"
sources = ["Cargo.*", "rust-toolchain*", ".cargo/**", "xtask/**", "crates/tsr_testhost/**", "crates/tsr_vfs/**", "crates/tsr_tspath/**", "crates/tsr_core/**", "crates/tsr_jsstring/**", "scripts/s11*.py", "scripts/tests/test_s11.py", "scripts/s04.py", "scripts/s04_common.py", "scripts/s04_runtime.py", "scripts/tracking-bootstrap.py", "data/s11/**", "tools/s11/**", "upstream"]
target = "host"
config = "S11 test-only framed subprocess transport; exact filesystem fixtures against pinned callbackFS and injected vfstest, actual contentmapper test-spawner byte streams, internal options-hook contracts, explicit control/cancellation/progress and malformed-protocol contracts; strict Unicode JSON domain, no disk fallback or compiler/language-service/fourslash semantic coverage"

[workspace]
command = ["python3", "scripts/tracking-bootstrap.py", "workspace"]
inputs = ["Cargo.toml", "Cargo.lock"]
sources = ["crates/**", "Cargo.*", ".cargo/**", "rust-toolchain*", "xtask/**", "scripts/tracking-bootstrap.py"]
target = "host"
config = "debug"

[oracle]
command = ["python3", "scripts/tracking-bootstrap.py", "oracle"]
inputs = ["data/upstream.json", ".gitmodules"]
sources = ["upstream", "scripts/tracking-bootstrap.py", "xtask/**"]
target = "host"
config = "release"

# Check producers (S02). A false metric is a measured failure; a missing tool is a failed run.
# `cargo xtask run` confirms capture, not the metric's value. CI must also enforce
# these booleans with `cargo xtask check-metrics`, independently of sprint gates.
[fmt]
command = ["python3", "scripts/checks.py", "fmt"]
inputs = ["rustfmt.toml"]
sources = ["crates/**", "xtask/**", "Cargo.*", "rust-toolchain*", "rustfmt.toml", "scripts/checks.py"]
target = "host"
config = "cargo fmt --all --check"

[clippy]
command = ["python3", "scripts/checks.py", "clippy"]
inputs = ["Cargo.toml", "Cargo.lock"]
sources = ["crates/**", "xtask/**", "Cargo.*", ".cargo/**", "rust-toolchain*", "clippy.toml", "scripts/checks.py"]
target = "host"
config = "debug; all targets and features; -D warnings"

[deny]
